spring.application.name=soggiorna

# ---- Database MySQL 8.0 ----
spring.datasource.url=jdbc:mysql://localhost:3306/soggiorna?useSSL=false&serverTimezone=Europe/Rome&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# In sviluppo "update" crea/aggiorna le tabelle in automatico.
# Per Basi di Dati usa lo schema in database/schema.sql e imposta "validate".
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# In produzione tieni il segreto fuori dal codice (variabile d'ambiente).
soggiorna.jwt.secret=cambia-questo-segreto-con-almeno-32-caratteri-casuali!!
soggiorna.jwt.expiration-ms=86400000

server.port=8080

# ---- Upload foto (RF-05) ----
# Cartella su disco (relativa alla working directory del processo backend) dove finiscono i file caricati,
# e URL con cui il backend li riespone via WebConfig (vedi config/WebConfig.java).
soggiorna.upload.dir=uploads
soggiorna.upload.public-base-url=http://localhost:8080
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
